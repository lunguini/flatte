name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
      - name: Test library
        run: go test ./...
      - name: Test samples
        working-directory: cmd
        run: go test ./...
      - name: Race (library)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Race (samples)
        if: matrix.os == 'ubuntu-latest'
        working-directory: cmd
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: vet (linux + windows cross-vet)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          cd cmd
          go vet ./...
          GOOS=windows go vet ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
      - name: govulncheck (library)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: govulncheck (samples)
        working-directory: cmd
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
