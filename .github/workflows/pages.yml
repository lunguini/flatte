name: pages

on:
  push:
    branches: [main]
    paths:
      - "cmd/flat-landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
      - name: Build WASM
        working-directory: cmd
        # Built with the standard Go toolchain (not TinyGo): its mature garbage
        # collector is required — TinyGo's GC deadlocks the asyncify scheduler
        # when a hosted app allocates during a JS callback. The wasm is shipped
        # gzip-compressed and decompressed in the browser via DecompressionStream.
        run: |
          GOOS=js GOARCH=wasm go build -o flat-landing/web/flat-landing.wasm ./flat-landing
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" flat-landing/web/wasm_exec.js
          gzip -9 -f flat-landing/web/flat-landing.wasm
      # The CNAME file in web/ is uploaded with the artifact so the custom
      # domain survives every redeploy (Actions deploys have no branch to
      # commit it back to).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cmd/flat-landing/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
