# Cloudflare Worker config for the Flatte Snake leaderboard.
#
# Deploy runs in CI (.github/workflows/leaderboard.yml); it builds the verifier
# wasm and runs `wrangler deploy` for you. The KV id below is not a secret.
# For local `wrangler dev`, add a preview_id from
#   wrangler kv namespace create LEADERBOARD_KV --preview
name = "flatte-leaderboard"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Bundle the verifier as a compiled WebAssembly.Module import.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# The whole leaderboard is one value in this namespace, under the key "board".
[[kv_namespaces]]
binding = "LEADERBOARD_KV"
id = "739cbe20be72433b925dd700019ebf96"

[observability]
enabled = true
