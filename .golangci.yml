version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # bugs
    - bodyclose
    - durationcheck
    - errorlint
    - makezero
    - nilerr
    - nilnil
    - copyloopvar
    - wastedassign
    - noctx
    # simplification and clarity
    - gocritic
    - unconvert
    - unparam
    - usestdlibvars
    - misspell
    - nolintlint
# Complexity and duplication are not gated: a cap makes code split into
# helpers to please a number (a flat switch over events is the clearest
# dispatcher and fails any cyclomatic limit). They are a report instead,
# for reviews:
#   golangci-lint run --enable-only gocognit,dupl ./...
# (a reading, not a rule: look at the top of the list, judge each).
  settings:
    dupl:
      threshold: 150 # tokens: whole blocks copied, not two similar lines
    gocognit:
      min-complexity: 50 # only for the report above
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"] # error strings are shown as sentences
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam # View helpers take State by pointer already; the rest are small
        - unnamedResult
        - commentedOutCode
        - whyNoLint
        - builtinShadow # min, max and new as local names read fine
        - rangeValCopy # small structs; copies are not hot paths
        # Taste, not bugs: following them churns code for no gain.
        - filepathJoin # "a/b" in tests is fine on every OS Go supports
        - initClause
        - importShadow
        - evalOrder
        - typeDefFirst
        - nestingReduce
        - ifElseChain
        - badCond # flags deliberate "both ran out" checks
        - weakCond
        - offBy1 # tests index text they just drew
        - mapKey
        - appendCombine
        - singleCaseSwitch
        - dupOption
        - regexpSimplify
        - boolExprSimplify
    misspell: {} # typos only: the code mixes US and UK spelling
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: [comments, std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [dupl, gocognit, errcheck, noctx, unparam]
      - path: ^cmd/ # samples: a CLI's plain exec and exit
        linters: [noctx, unparam]
      - path: ^cmd/
        text: exitAfterDefer
      - path: ^cmd/bubble- # the Bubble Tea comparison apps stay as written (the benchmark)
        linters: [gocritic, unparam, unused, errcheck, staticcheck]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/lunguini]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
